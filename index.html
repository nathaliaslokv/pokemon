
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-danger">
        <div class="container">
            <span class="navbar-brand">Pokédex</span>
        </div>
    </nav>

    <div class="container mt-4">

        <div class="row justify-content-center">
            <div class="col-md-6">

                
                <div class="card shadow mb-4">
                    <div class="card-body">

                        <h3 class="text-center mb-3">
                            Pesquisar Pokémon
                        </h3>

                        <div class="input-group">
                            <input type="text" id="pokemon"
                                   class="form-control" value="Pikachu">

                            <button class="btn btn-danger"
                                    onclick="buscarPokemon()">
                                Buscar
                            </button>
                        </div>

                    </div>
                </div>

                
                <div class="card shadow mb-4">
                    <div class="card-body">

                        <h3 class="text-center" id="nome">
                            Pikachu #25
                        </h3>

                        <div class="text-center">
                            <img id="imagem"
                                 src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png"
                                 width="220" height="220"
                                 alt="Pokémon">
                        </div>

                        <hr>

                        <h6 class="text-center">Tipo</h6>
                        <div class="text-center mb-3" id="tipo"></div>

                        <div class="row text-center mb-4">
                            <div class="col-6">
                                <b>Altura</b>
                                <p id="altura">0.4 m</p>
                            </div>

                            <div class="col-6">
                                <b>Peso</b>
                                <p id="peso">6 kg</p>
                            </div>
                        </div>

                        <h5 class="text-center mb-3">Status</h5>

                        <div class="mb-3">
                            <label id="labelhp">HP: 35</label>
                            <div class="progress">
                                <div id="barrahp"
                                     class="progress-bar bg-danger"
                                     style="width:35%">35</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label id="labelataque">Ataque: 55</label>
                            <div class="progress">
                                <div id="barraataque"
                                     class="progress-bar bg-warning"
                                     style="width:55%">55</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label id="labeldefesa">Defesa: 40</label>
                            <div class="progress">
                                <div id="barradefesa"
                                     class="progress-bar bg-info"
                                     style="width:40%">40</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label id="labelvelocidade">Velocidade: 90</label>
                            <div class="progress">
                                <div id="barravelocidade"
                                     class="progress-bar bg-success"
                                     style="width:90%">90</div>
                            </div>
                        </div>

                        <h5 class="text-center mt-4 mb-3">
                            Habilidades
                        </h5>

                        <div class="text-center" id="habilidades"></div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
